; doodlesoul — every flash births one unique character that lives in your
; stick forever. Engine: https://github.com/evandroguedes/doodleink

[env:m5stick-c-plus]
platform = espressif32@6.9.0
board = m5stick-c
framework = arduino
build_flags =
    -O3
    -ffast-math
lib_deps =
    m5stack/M5Unified@^0.2.7
    https://github.com/evandroguedes/doodleink.git
monitor_speed = 115200
upload_speed = 1500000
